name: Test OpenWeather Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
        run: |
          missing_secrets=0

          for secret_name in API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID LAT LON; do
            eval val=\$$secret_name
            if [ -z "$val" ]; then
              echo "❌ $secret_name secret is not set!"
              missing_secrets=1
            else
              echo "✅ $secret_name is configured"
            fi
          done

          if [ $missing_secrets -eq 1 ]; then
            echo ""
            echo "Go to your Repository Settings > Secrets and variables > Actions and add the missing secrets."
            exit 1
          fi

          echo ""
          echo "All required secrets are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          else
            echo "❌ main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found"
          else
            echo "❌ requirements.txt not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      - name: Run Weather Script Test
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
        run: |
          echo "Running main.py..."
          python main.py

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  All checks and script execution passed!"
          echo "  Your OpenWeather setup is ready to go."
          echo "========================================"
